<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Epineon — One AI Ecosystem, Built on Trust | Precision Life Science</title>
    <meta
      name="description"
      content="Epineon builds trusted, human-centered AI across enterprise security, health & wellness, and future intelligence. Explore our ecosystem."
    />
    <link rel="canonical" href="https://epineon.ai/" />

    <!-- Open Graph / social (static fallback for scrapers that don't run JS) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Epineon" />
    <meta property="og:title" content="Epineon — One AI Ecosystem, Built on Trust" />
    <meta
      property="og:description"
      content="Trusted, human-centered AI across enterprise security, health & wellness, and future intelligence."
    />
    <meta property="og:url" content="https://epineon.ai/" />
    <!-- TODO: add a 1200x630 social image at client/public/og-image.png -->
    <meta property="og:image" content="https://epineon.ai/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Epineon — One AI Ecosystem, Built on Trust" />
    <meta
      name="twitter:description"
      content="Trusted, human-centered AI across enterprise security, health & wellness, and future intelligence."
    />
    <meta name="twitter:image" content="https://epineon.ai/og-image.png" />
    <style>
      html,
      body {
        margin: 0;
        background: #000;
        color: #f5f1e8;
      }
      #root {
        min-height: 100dvh;
      }
      .app-boot-fallback {
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 2rem 1.5rem;
        text-align: center;
        font-family: Manrope, system-ui, sans-serif;
      }
      .app-boot-fallback p {
        margin: 0;
        max-width: 20rem;
        font-size: 0.95rem;
        line-height: 1.5;
        color: #a8a39a;
      }
      .app-boot-fallback strong {
        color: #e8c95a;
        font-weight: 600;
      }
      .app-boot-fallback button {
        margin-top: 0.5rem;
        border: 1px solid rgba(212, 175, 55, 0.45);
        border-radius: 9999px;
        background: rgba(13, 13, 17, 0.92);
        color: #e8c95a;
        cursor: pointer;
        font: inherit;
        font-size: 0.9rem;
        padding: 0.65rem 1.25rem;
      }
    </style>
    <script>
      ;(function () {
        var root = document.getElementById('root')
        if (!root) return

        root.innerHTML =
          '<div class="app-boot-fallback" role="status" aria-live="polite">' +
          '<strong>Loading Epineon…</strong>' +
          '<p>Please wait a moment.</p></div>'

        var bootTimer = window.setTimeout(showBootError, 12000)
        var appStarted = false

        function showBootError() {
          if (appStarted) return
          root.innerHTML =
            '<div class="app-boot-fallback" role="alert">' +
            '<strong>Page didn\u2019t load correctly</strong>' +
            '<p>Your browser may be using an old cached copy. Refresh, or open this site in Chrome or Safari instead of an in-app preview.</p>' +
            '<button type="button">Refresh</button></div>'
          var btn = root.querySelector('button')
          if (btn) btn.addEventListener('click', function () { location.reload() })
        }

        window.addEventListener(
          'error',
          function (e) {
            var t = e.target
            if (t && (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && t.rel === 'stylesheet'))) {
              showBootError()
            }
          },
          true,
        )

        window.addEventListener('unhandledrejection', function (e) {
          var msg = String((e.reason && e.reason.message) || e.reason || '')
          if (msg.indexOf("Unexpected token '<'") !== -1 || msg.indexOf('Failed to fetch dynamically imported module') !== -1) {
            showBootError()
          }
        })

        var observer = new MutationObserver(function () {
          if (root.querySelector('.landing-page-dark, .site-header, header.site-header')) {
            appStarted = true
            window.clearTimeout(bootTimer)
            observer.disconnect()
          }
        })
        observer.observe(root, { childList: true, subtree: true })
      })()
    </script>
  </head>
  <body>
    <noscript>
      <div
        style="
          padding: 2rem 1.5rem;
          text-align: center;
          font-family: system-ui, sans-serif;
          color: #f5f1e8;
          background: #000;
        "
      >
        <p style="margin: 0 0 0.5rem; color: #e8c95a; font-weight: 600">JavaScript is required</p>
        <p style="margin: 0; color: #a8a39a">Enable JavaScript to view epineon.ai, or email contact@epineon.ai.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
